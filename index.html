<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- スマホでは viewport 指定が無いと既定の約980px幅でレイアウトされ、画面全体が縮小されて
     文字もボタンも極端に小さくなる（GDD §3.5 のタッチ操作が実質使えない）。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ハネダン！ — 壁で跳ね返して撃ち抜く戦車ゲーム</title>
<meta name="description" content="壁に弾を反射させて敵戦車を撃ち抜く、ブラウザで動くトップダウン戦車対戦ゲーム。全50ミッション・敵10種・難易度3段階。インストール不要。">
<!-- SNS でリンクを貼ったときのカード表示（画像は public/ogp.png＝自作のプレイ画面） -->
<meta property="og:type" content="website">
<meta property="og:title" content="ハネダン！ — 壁で跳ね返して撃ち抜く戦車ゲーム">
<meta property="og:description" content="全50ミッション・敵10種・難易度3段階。ブラウザで、インストール不要で遊べます。">
<meta property="og:image" content="https://bmb9mm64-source.github.io/-/ogp.png">
<meta property="og:url" content="https://bmb9mm64-source.github.io/-/">
<meta name="twitter:card" content="summary_large_image">
<!-- タブアイコン（外部ファイル不要のインラインSVG。favicon 404 のコンソールエラー防止） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='5' width='12' height='9' rx='1' fill='%232f6fd0'/%3E%3Ccircle cx='8' cy='9' r='3' fill='%237fb2ff'/%3E%3Crect x='7' y='1' width='2' height='6' fill='%237fb2ff'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #14161c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #9aa4b8;
    user-select: none;
    /* タッチ操作中にページがスクロール・引っ張り更新しないようにする（照準ドラッグが奪われるため） */
    touch-action: none;
    overscroll-behavior: none;
  }
  /* Phaser の FIT 拡大は「親要素の大きさ」に合わせる。親に大きさを与えないと
     expandParent がゲームの基準サイズ（800px）まで親を広げてしまい、
     狭い画面では canvas が画面外へはみ出す。ビューポート全体を親にする。 */
  #app {
    width: 100vw;
    height: 100vh;
  }
  /* canvas は既定でインライン要素なので、下にベースラインぶんの隙間（約4px）ができる。
     #app が画面ちょうどの高さだとその4pxぶん文書が縦にはみ出し、
     ゲーム画面なのにスクロールバーが出てしまう。 */
  #app canvas {
    display: block;
  }
  /* 操作説明はゲーム画面（Phaser）側が場面に応じて出す。ここに固定文を置くと
     エディタ画面では誤情報になり、狭いウィンドウでは盤面を画面外へ押し出してしまう。
     案内は position: fixed にしてレイアウトの高さを奪わせない。 */
  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6px;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-align: center;
    padding: 0 12px;
    pointer-events: none;
  }
  /* 盤面は横長（25×17タイル）なので、縦持ちだと大半が余白になる。縦持ちのときだけ案内する。 */
  #rotate-hint { display: none; }
  @media (hover: none) and (orientation: portrait) {
    #rotate-hint { display: block; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint" id="rotate-hint">📱 横向きにすると画面が大きくなります</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
